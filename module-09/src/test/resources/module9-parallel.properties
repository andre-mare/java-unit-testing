# Module 9.5 lab – run the whole course project in parallel.
#
# Copy these lines into src/test/resources/junit-platform.properties.
# Or try them for one run without editing anything, for example:
#   mvn test -Djunit.jupiter.execution.parallel.enabled=true \
#            -Djunit.jupiter.execution.parallel.mode.default=concurrent \
#            -Djunit.jupiter.execution.parallel.mode.classes.default=concurrent
#
# Then fix every test that fails or fails only sometimes (run it a few times):
#   - shared static state (counters, lists, singletons): @ResourceLock, or @Execution(SAME_THREAD)
#   - default locale / time zone / system properties changed by hand: use the 9.3 / 9.4 annotations
#   - System.out / System.err captured by hand: @ResourceLock(Resources.SYSTEM_OUT) or @Isolated
#   - classes with a MethodOrderer or PER_CLASS: they stay same-thread unless they say otherwise
#   - tests that wait on each other or on timing: give them generous timeouts or isolate them

# 1. Switch it on (default false).
junit.jupiter.execution.parallel.enabled = true

# 2. What runs concurrently: methods within a class (mode.default) and top-level
#    classes (mode.classes.default). Both concurrent = everything in parallel.
#    The other three combinations: same_thread/same_thread (nothing parallel),
#    concurrent classes with same_thread methods, same_thread classes with concurrent methods.
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# 3. How many threads: dynamic = factor x number of processors (the default strategy).
junit.jupiter.execution.parallel.config.strategy = dynamic
junit.jupiter.execution.parallel.config.dynamic.factor = 1
# Alternatives:
#junit.jupiter.execution.parallel.config.strategy = fixed
#junit.jupiter.execution.parallel.config.fixed.parallelism = 4
#junit.jupiter.execution.parallel.config.fixed.max-pool-size = 4

# 4. Optional (experimental): the thread pool behind it; fork_join_pool is the default.
#junit.jupiter.execution.parallel.config.executor-service = worker_thread_pool
